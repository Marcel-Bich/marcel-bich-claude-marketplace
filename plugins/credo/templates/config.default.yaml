# credo default configuration (builtin template, read-only).
#
# This ships with the plugin and is the lowest layer of the config cascade:
#   builtin (this file) < global (~/.claude/credo/config)
#     < profile ($CLAUDE_CONFIG_DIR/credo/config) < project (.credo/config)
#
# On first need the global config is created from this template. It carries
# UNIVERSAL defaults (safe for everyone). PERSONAL and environment-specific
# fields are intentionally left EMPTY and are filled just-in-time by the skills
# that need them (permission per change). Never put personal values or absolute
# machine paths into this shipped template.

# --- project targeting (hub guard) -------------------------------------------
# hub: true  -> this directory is a launch hub; credo never auto-targets its .credo,
#               an explicit target (CREDO_DIR or /credo:project) is always required.
# This flag is read from THIS directory's own .credo/config only (the project layer),
# never the merged cascade, so it can never leak from a global default. Leave it unset
# (the shipped default) for normal repos where credo operates in place.
# hub: true

# --- task backend ------------------------------------------------------------
# Which task system credo runs on. Core project choice.
#   credo (default) - credo's item lifecycle is active.
#   gsd             - the credo item model stands down (get-shit-done owns tasks).
#   none            - same as credo (items active).
# Anything unset, empty, or unknown behaves like credo, so the default is safe.
# The CREDO_TASK_BACKEND env var overrides this value when set and non-empty.
task_backend: credo

# --- model preset ------------------------------------------------------------
# Which model preset drives subagent model and effort choices: quality, balanced
# (default when unset), budget, or any custom name under presets: (set it there
# in the global or project config). The built-in presets live in
# templates/presets.default.yaml; show them with scripts/credo-preset.sh show.
# The mainagent model and effort in a preset are a recommendation only; they do
# not change your own /model and /effort.
# The line stays commented out: no preset line means balanced, and a fresh global
# config then shows the setup preset menu. /credo:setup writes the line once you choose.
# preset: balanced
# presets:            # custom preset example (same schema as the built-in ones)
#   my-mix:
#     mainagent: {model: claude-opus-5-5, effort: medium}
#     build: {model: claude-sonnet-5-5, effort: low}

# --- visual verify -----------------------------------------------------------
verify:
  # Fixed viewport widths (px) for visual verification.
  viewports:
    - 320
    - 768
    - 1440
  # Command to bring up / restart the LOCAL runtime surface for a ui: true verify.
  # Empty by default. An agent may restart autonomously ONLY when it has positively
  # verified the target is local (a process on THIS machine, bound to localhost - NOT a
  # deployed, remote, or shared environment). Locality is judged by where the process
  # runs, NOT by the git branch: a checkout named main/develop/prod does not make it
  # remote. Set this to the project's local bring-up command; empty -> the agent falls
  # back to the documented local run procedure or defers as human-only. A guessed
  # command is never run (see the credo safety skill).
  local_bringup: ""
  # Primary test tier for bringing an item to done. Pre-filled with a default example so
  # the setting is discoverable rather than silently empty. This value names only the FIRST
  # tier of a fallback chain that always applies in order:
  #   1. this primary_test stage, if it exists in the project (adapt the value to name it);
  #   2. else Playwright with real input (visual/responsive/theme + held-gesture/timing);
  #   3. else a reviewer/audit agent.
  # Tiers 2 and 3 are credo built-ins and ALWAYS apply as fallbacks - they are not
  # either/or with tier 1. If tier 1 is configured but not found in the project, the agent
  # uses the fallbacks AND asks you once whether to adapt this value or clear it (empty ->
  # the fallbacks apply with no question). Synthetic dispatchEvent measurements are not
  # sufficient proof for held-input behavior.
  primary_test: "tier 1: a debug read/write device driving a state machine (adapt to this project's primary automated test entry point, or clear this tier); if tier 1 is absent, the fallbacks still apply - tier 2: Playwright with real input for visual/responsive/theme and held-gesture/timing; else tier 3: a reviewer/audit agent"

# --- timing windows ----------------------------------------------------------
windows:
  # Grace period (minutes) before an autonomous rest/hibernate action.
  veto_minutes: 20
  # Wait window (minutes) for a deferred question answer before falling back
  # to a documented default and continuing autonomously.
  deferred_question_minutes: 5

# --- ntfy notifications (hybrid model) ---------------------------------------
# Universal default. The ntfy TOPIC is personal and lives under personal.ntfy_topic
# (empty -> notifications are skipped). This interval is the progress-digest cadence:
# come-to-PC events are sent immediately, progress events are bundled into one digest.
ntfy:
  # Progress digest bundling interval (minutes).
  digest_interval_minutes: 60

# --- session-context compact trigger (not budget) ----------------------------
compact:
  # Session-context fill thresholds that auto-run compact-plus.
  # Percent of the way to auto-compact (the tacho), not percent of the full
  # window - matches limit v2.32.0.
  thresholds:
    - 80
    - 92

# --- wakeup offsets (relative to a limit reset) ------------------------------
wakeup:
  # Preferred delay (minutes) after a limit reset before resuming.
  reset_offset_minutes: 5
  # Fallback delay (minutes) if the preferred offset cannot be used.
  fallback_offset_minutes: 1

# --- sleep (autonomous end-of-run / weekly-cap machine power-down) ------------
# Default OFF for safety: a server running autonomous work must NEVER be powered
# down unexpectedly. Enable only on a personal machine you want powered down when
# autonomous work finishes or hits the weekly cap. Opt in via /credo:setup, which
# detects the platform and stores the exact command.
#   mode:    "suspend" (standby / suspend-to-RAM) or "hibernate" (suspend-to-disk).
#            On native Linux, hibernate is often unavailable (needs swap >= RAM) -
#            suspend is the reliable default there; on WSL, hibernate (shutdown.exe /h)
#            is the norm. Empty until chosen at setup.
#   command: the exact shell command run to power down. Filled at setup; empty means
#            not configured (an enabled-but-empty command is a misconfig - the run then
#            ends cleanly WITHOUT powering down, never a guessed command).
sleep:
  enabled: false
  mode: ""
  command: ""
  # Suspend/hibernate retry + success detection. A power-down attempt is retried up to
  # retry_count times, retry_spacing_s apart, but only while the machine is still awake.
  # On the next wake/turn the elapsed time since the pending-suspend marker is compared:
  # a jump larger than success_gap_min minutes means the machine really slept (success) -
  # the marker is cleared, the intent dropped, and the power-down is NOT retried or
  # treated as a failure. Applies to both suspend and hibernate.
  retry_count: 3
  retry_spacing_s: 30
  success_gap_min: 5

# --- budget (consumed by the budget skill, Phase 5) --------------------------
# Universal default cap schedule. Values are percent. Off-hours five_hour_cap
# uses the soft/hard band (soft warn, hard stop); work-hours (Mon-Fri 09-17)
# cap the 5h window low so the 09:00 guard holds.
budget:
  five_hour:
    soft_percent: 92
    hard_percent: 95
  # Autonomous-run 5h pacing ladder (credo-5h-budget-guard.sh PreToolUse hook).
  # Active ONLY for a session whose autonomy flag is set (per session:
  # credo/autonomy/<session_id>/active). Two tracks read the live 5h
  # utilization before each relevant tool call and self-limit; the soft stages
  # inject a recommendation, the hard stages block disallowed tool calls (concept:
  # docs/TODO-credo-5h-budget-guard-concept.md, sections 5a/5b/6).
  #   main_ladder     [soft, soft, soft, HARD, HARD-lockdown]  (percent)
  #   subagent_ladder [soft, HARD, HARD]                       (percent)
  #   refresh_floor_seconds: lower bound the guard honors before re-warming the
  #                          limit cache (refresh-usage.sh owns its own 60s floor;
  #                          this documents the intended cadence).
  autonomous_5h:
    main_ladder:
      - 83
      - 87
      - 90
      - 92
      - 97
    subagent_ladder:
      - 83
      - 90
      - 92
    refresh_floor_seconds: 60
  work_hours:
    start: 9
    end: 17
  # At 09:00 on each work day at least this much of the 5h limit must remain.
  nine_oclock_guard_reserve_percent: 60
  # Task-sizing recommendation by remaining 5h budget (percent used).
  # Recommendation only, must never cause a standstill.
  task_sizing:
    large_below_percent: 70
    medium_below_percent: 90
  # Weekly reset handling in autonomous mode. When the weekly reset is NEAR
  # (seven_day.resets_at falls on the same local calendar day - read dynamically
  # from the limit cache, never hardcoded) and weekly usage reaches switch_percent,
  # the agent pauses via chained wake-ups until the reset and then resumes with a
  # fresh weekly budget, instead of hibernating. The 99% weekly fail-safe hibernate
  # (budget_failsafe.weekly_percent) always remains the last-resort net.
  weekly_pause:
    enabled: true
    switch_percent: 97
  # Cap schedule. five_hour_cap is the hard cap for that window; off-hours use
  # the soft/hard band above (95 hard). weekly_cap is the weekly ceiling.
  # Weekly has NO soft/hard band: weekly_cap is a plain ceiling, unrelated to the
  # 5h soft_percent/hard_percent. A 95 in both a five_hour_cap and a weekly_cap cell
  # is coincidental, not a shared weekly band.
  schedule:
    - day: sunday
      window: all_day
      five_hour_cap: 95
      weekly_cap: 30
    - day: monday
      window: work_hours
      five_hour_cap: 40
      weekly_cap: 40
    - day: monday
      window: off_hours
      five_hour_cap: 95
      weekly_cap: 40
    - day: tuesday
      window: work_hours
      five_hour_cap: 40
      weekly_cap: 50
    - day: tuesday
      window: off_hours
      five_hour_cap: 95
      weekly_cap: 50
    - day: wednesday
      window: work_hours
      five_hour_cap: 40
      weekly_cap: 60
    - day: wednesday
      window: off_hours
      five_hour_cap: 95
      weekly_cap: 60
    - day: thursday
      window: work_hours
      five_hour_cap: 40
      weekly_cap: 70
    - day: thursday
      window: off_hours
      five_hour_cap: 95
      weekly_cap: 70
    - day: friday
      window: before_work
      five_hour_cap: 95
      weekly_cap: 80
    - day: friday
      window: work_hours
      five_hour_cap: 40
      weekly_cap: 80
    - day: friday
      window: after_17
      five_hour_cap: 95
      weekly_cap: 99
    - day: saturday
      window: before_reset
      five_hour_cap: 95
      weekly_cap: 99
    - day: saturday
      window: after_reset
      five_hour_cap: 95
      weekly_cap: 30

# --- absolute fail-safe caps (used on compact loss of an explicit order) -----
budget_failsafe:
  five_hour_percent: 98
  weekly_percent: 99

# --- resource gate for parallel subagents (scripts/credo-resource-check.sh) ---
# Before EVERY agent start (every mode) the check looks at CPU and RAM: the 1-min
# load per CPU (max_busy_percent) and the used RAM share (max_ram_percent; under WSL
# also the Windows host RAM). At the limit it answers "wait" and no new agent starts. Free disk is checked at every start too: the item's
# disk_gb plus disk_reserve_gb must fit on the target drive (an item without disk_gb
# needs only the reserve). The rules live in the credo orchestration skill; only
# thresholds live here.
resources:
  max_busy_percent: 94         # CPU: wait at this load share or more (WSL load and, under WSL, the Windows host)
  max_ram_percent: 80          # RAM: wait at this used share or more (WSL VM and, under WSL, the Windows host)
  disk_reserve_gb: 3

# --- builders per independent area (credo orchestration skill) ----------------
# Writing builders run in parallel per independent area: at least min_per_area and
# at most max_per_area. Read-only agents (explore, research, audit, verify, tests,
# deploy) have no fixed limit. Items that touch the same files never run in parallel.
builders:
  min_per_area: 2
  max_per_area: 4

# --- release (credo session-autonomous, /credo:setup and migrate) -------------
# auto: false (default) -> no automatic release. auto: true -> when no GO item is
# buildable and changelog fragments exist, the session releases them with the
# project's own release procedure. Fallback: release anyway at fallback_fragments
# fragments or after fallback_days days, whichever comes first. /credo:setup and the
# migration ask once and write the answer here (project layer).
release:
  auto: false
  fallback_fragments: 15
  fallback_days: 7

# --- ask behaviour (credo session-active, session-passive, requirements-verbatim) ---
# false (default): questions are asked as the workflow needs them.
# true (opt-in, costs search tokens): before every question the agent first searches
# the requirement logs, the items, the handoff and earlier Ask answers; an earlier
# approval counts as the owner's answer and is not asked again.
dont_ask_twice: false

# --- optimisation audit (/credo:optimize) -------------------------------------
# The audit is opt-in per repo (asked at credo setup / onboarding) and is offered
# again only to RETURNING users: when every activity signal of the repo (credo's
# last-seen, the reflog, the git index, modified files) is at least idle_days old.
# Never offered to someone actively working, never in autonomous mode.
optimize:
  idle_days: 7

# --- agent temp cleanup (provenance ledger, credo-cleanup.py, #174) ----------
# Hooks record what a session (and its subagents) creates; the agent removes its own
# leftovers without a prompt through credo-cleanup.py own-rm (ledger-verified). Read from
# the LOCAL layers only (global ~/.claude/credo/config and the profile layer), never from a
# project .credo/config, so keep paths and cache paths are never versioned.
#   enabled         false -> the ledger hooks record nothing (SessionStart reads it)
#   session_tmpdir  false -> no per-session TMPDIR export (the dir is still created)
#   keep_paths      paths the helper never removes, ledger or not (owner keep list);
#                   ~/.claude*/** is always protected and need not be listed
#   cache_caps      {"<cache dir>": <MB>}: size cap per shared cache; over the cap is
#                   reported (credo-cleanup.py caches), never deleted per session
cleanup:
  enabled: true
  session_tmpdir: true
  keep_paths: []
  cache_caps: {}

# --- GO stall check (credo-go-stall.sh, the autonomous idle path) ------------
# A GO item in 2_go is listed as stalled when neither its file nor its last History line
# shows progress for this many hours. The listing is read-only; every listed item is then
# classified (credo items skill, "GO stall classification"). A hours argument overrides it.
items:
  go_stall_hours: 24

# --- tmux hint (SessionStart) -----------------------------------------------
# When credo is active and a session starts outside tmux, the SessionStart hook adds
# one short line recommending tmux (self-compact and self-reload need it). false ->
# never show it again. /credo:setup Step 11 writes false into the global (or profile)
# layer when the user declines tmux ("No, skip tmux" / "No, I start tmux myself").
tmux:
  hint: true

# --- periodic quality reminder (hooks/credo-reminder.sh, scripts/credo-reminder.py) ---
# ON by default (opt-out). A credo session in tmux gets a reminder prompt typed into its
# own pane (the input field must be empty and the session idle) when its mode's trigger
# fires. Turns count the real user turns since the last reminder, minutes the time since
# the last reminder. A mode may set both; whichever comes first triggers. The first 10 turns of a
# fresh session only arm the reminder. Allowed modes: active, passive, autonomous.
# Each reminder is one full turn for the agent (it re-reads the rules, the items, the logs
# and the handoff), so it costs tokens. Autonomous mode can send up to 24 per day.
# Off switches, in any user config layer:
# - enabled: false turns the whole reminder off
# - turns: 0 and minutes: 0 under a mode (or the mode set to off) turns that mode off
# Each key merges with these defaults one by one. autonomous: {turns: 5} keeps the default
# minutes 60, so set minutes: 0 as well to leave only the turns trigger.
# text: optional one-line override of the built-in text after the marker "[credo-reminder]"
# (empty = built-in). Changes apply to a running worker within a minute.
reminder:
  enabled: true
  text: ""
  active: {turns: 20}          # every 20 user turns in active mode
  passive: {turns: 20}         # every 20 user turns in passive mode
  autonomous: {minutes: 60}    # every 60 min in autonomous mode (no turns while away)
  paused: {turns: 20}          # autonomous with keep-alive paused (owner present): every 20 turns, no time; 0 = off

# --- peer trust guard (PreToolUse, hooks/credo-peer-message.sh) ---------------
# A Bash command that grants LAN peer trust (credo-peer-lan.py trust add, or a write
# to the trust file) is recognized by the peer-message hook. quiet: true (default)
# -> only a non-blocking reminder that only the user grants trust; no confirmation
# dialog, so autonomous runs with peers are never blocked. quiet: false (strict) ->
# the hook asks the user to confirm every grant (a hook "ask" overrides allow rules
# and bypass mode). Env CREDO_PEER_TRUST_GUARD_QUIET overrides this key. Read from
# the builtin, global and profile layers only - a project .credo/config is ignored
# for this key. Without python3 the config is not read (only the env applies).
# /credo:setup offers to switch strict mode on.
peer:
  trust_guard:
    quiet: true
  # WSL <-> native Windows peer bridge (scripts/credo-win-bridge.py, /credo:peer-lan
  # "Windows sessions"). Under WSL with Windows interop, the native Windows Claude Code
  # sessions of the same Windows user appear in ListAgents of WSL sessions and can be
  # messaged, and the WSL sessions (plus LAN peers) appear on Windows. The SessionStart
  # hook starts it. Security: the WSL user gains send rights to the Windows user's
  # sessions and the reverse; session tokens never leave their side. false = off (a
  # running bridge stops within a minute). Env CREDO_WIN_BRIDGE (0/1) overrides. Read
  # from the builtin, global and profile layers only - a project .credo/config is ignored.
  win_bridge:
    enabled: true

# --- remote mirror (hooks/credo-remote-mirror.sh) ---------------------------------
# Off by default (empty). When set, credo's hooks forward ONLY the events that need the
# owner to an external sink: an Ask-box question (PreToolUse AskUserQuestion), a permission
# dialog (PermissionRequest), a question code "Q<n>" of a finished reply, a test block
# marked "[blocking]", a "Blocker: <text>" line, and the reply to a message that started
# with "[remote chat <id>]". The hooks never block, answer or change a tool call. The
# command runs through bash with ONE JSON event on stdin, in the background, with a 5 s
# timeout and its output discarded. A failing sink never breaks the session.
# Read from the builtin, global and profile layers only: a project .credo/config is ignored
# (a repository must not point session events at a command of its own).
remote:
  mirror_command: ""
  # questions, tests, blockers and permission prompts are mirrored only while the owner is
  # likely away: the session runs autonomously (not paused), or the owner typed nothing in
  # it for this many minutes; 0 = always mirror. Replies to the app are always mirrored.
  mirror_idle_minutes: 10

# --- self-restart plugin update allowlist (/credo:self-restart run --update) --
# Which plugins `run --update` may update before the session restarts. A mapping
# marketplace name -> "*" (all installed plugins of that marketplace) or a list of
# plugin names. UNSET (the default) -> only the marketplace credo itself was
# installed from. Plugins of marketplaces not listed are never touched, and the
# helper never changes autoUpdate settings or known_marketplaces.json.
# WARNING: widening this to third-party marketplaces is at your own risk - an
# update pulls whatever that marketplace currently publishes, unreviewed.
# self_update:
#   marketplaces:
#     marcel-bich-claude-marketplace: "*"
#     some-other-marketplace: [plugin-a, plugin-b]

# --- personal / environment fields (left EMPTY, filled just-in-time) ---------
# Never committed with real values in the shipped template. The global config
# holds the user's real values; those live in ~/.claude/credo/config, not here.
personal:
  # ntfy topic for push notifications. Empty -> notifications are skipped.
  ntfy_topic: ""
  # ntfy server base URL. Default is the public ntfy.sh server; override in the
  # personal layer to point at a self-hosted instance.
  ntfy_server: "https://ntfy.sh"
  # ntfy opt-out marker. Setup-only: distinguishes "user declined notifications"
  # from "never asked" so /credo:setup stops re-asking. true -> setup skips the ntfy
  # question. It does NOT add any runtime prompt (runtime still just skips ntfy
  # silently when the topic is empty).
  ntfy_optout: false
  # Expected commit-identity hint (optional). Empty (recommended when you use more than
  # one identity) -> rely on the repo's git-log history plus its local gitconfig. It MAY
  # be set here as a default identity, but it is then overridden per project (cascade:
  # global < project). WARNING: a global hint applies to ALL repos and can clash with a
  # repo that uses a different identity (e.g. a work repo vs a private repo) - override it
  # per project there. The git-log comparison is always the primary check; the hint is
  # only an optional cross-check on top.
  commit_identity_hint: ""
  # WSL / Windows-side reachability hints.
  #
  # lan_ip is dynamic (the host's real LAN address); leave it empty - it is resolved at
  # runtime and never hardcoded. endpoints is a named list of Windows-side services, each
  # carrying its own reach path (different services on one machine bind differently):
  #   reach: lan_ip    -> service binds 0.0.0.0; reached from WSL via the Windows LAN-IP
  #                       plus its port, never via localhost/127.0.0.1.
  #   reach: localhost -> Windows-localhost-only service; reached via powershell.exe.
  # Example (commented, generic - fill with real names/ports just-in-time):
  #   endpoints:
  #     - name: panel      # a UI/panel bound to 0.0.0.0
  #       port: 0
  #       reach: lan_ip
  #     - name: core       # an API bound to Windows localhost only
  #       port: 0
  #       reach: localhost
  wsl:
    lan_ip: ""            # dynamic, resolved at runtime, never hardcoded
    endpoints: []         # list of {name, port, reach}; reach: lan_ip | localhost
  # Living-docs file list (relative names). Empty -> ask when first needed.
  docs: []
