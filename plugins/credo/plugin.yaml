name: credo
description: "The mentor framework for Claude Code: a self-contained process layer with per-session modes, a work-item lifecycle with a hard Definition of Done, budget-aware autonomy, visual verification, and safety rules that travel into every subagent"
version: 0.38.0
author: Marcel Bich
repository: https://github.com/Marcel-Bich/marcel-bich-claude-marketplace

commands:
  psalm:
    description: Interactive guide to available topics and workflows
    source: commands/psalm.md
  setup:
    description: Interactive setup wizard - install plugins, sync instructions, init project
    source: commands/setup.md
  migrate:
    description: Migrate an existing repo into the .credo/ structure
    source: commands/migrate.md
  project:
    description: Pin the target repo for credo's project layer (hub-aware), or show the resolved target
    source: commands/project.md
  session-init:
    description: Initialize session with main agent workflow instructions
    source: commands/session-init.md
  session-active:
    description: Set the session mode to active (intensive live collaboration, no keep-alive)
    source: commands/session-active.md
  session-passive:
    description: Set the session mode to passive (user available for clarifications only, no keep-alive)
    source: commands/session-passive.md
  session-autonomous:
    description: Set the session mode to autonomous (work approved GO items unattended, hook-enforced keep-alive on)
    source: commands/session-autonomous.md
  role-task:
    description: Set this session's default role to task/build (owns implementing GO items incl. commits/push per dogma)
    source: commands/role-task.md
  role-plan:
    description: Set this session's default role to plan/clarify (owns clarifying 1_clarify items, no commits/push)
    source: commands/role-plan.md
  role-clear:
    description: Clear this session's default role (back to no role; the agent does everything)
    source: commands/role-clear.md
  sandbox-promote:
    description: Promote an accepted sandbox artifact from .credo/sandbox-tmp/ to .credo/sandbox/
    source: commands/sandbox-promote.md
  explain:
    description: Explain something in depth (what/why/example/consequences)
    source: commands/explain.md
  disable:
    description: Disable credo for this directory (silence onboarding and the [credo] line here, reversible)
    source: commands/disable.md
  enable:
    description: Enable credo for this directory (opt in; overrides a previous decline)
    source: commands/enable.md
